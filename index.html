<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑白记账 - 极简风格的个人记账应用</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#000; color:#fff; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
        .container { max-width:800px; padding:40px 20px; text-align:center; }
        .logo { width:120px; height:120px; margin:0 auto 20px; }
        h1 { font-size:3rem; font-weight:800; letter-spacing:8px; margin-bottom:8px; }
        .tagline { font-size:1.2rem; color:#aaa; margin-bottom:40px; }
        .features { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; margin:40px 0; }
        .feature-card { background:#111; border:1px solid #333; border-radius:16px; padding:20px; text-align:center; }
        .feature-icon { font-size:3rem; margin-bottom:10px; }
        .feature-title { font-weight:600; margin-bottom:6px; }
        .feature-desc { font-size:0.9rem; color:#888; }
        .btn { display:inline-block; background:#fff; color:#000; padding:12px 24px; border-radius:24px; font-weight:700; text-decoration:none; margin:10px; transition:all .2s; }
        .btn:hover { background:#ddd; }
        .btn-outline { background:transparent; border:1.5px solid #fff; color:#fff; }
        .btn-outline:hover { background:#fff; color:#000; }
        footer { margin-top:40px; color:#666; font-size:0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 应用图标（使用你设计的 SVG 转 PNG 或直接用 SVG） -->
        <svg class="logo" viewBox="0 0 1024 1024">
            <rect x="0" y="0" width="1024" height="1024" rx="180" fill="#000000" stroke="#333" stroke-width="8"/>
            <circle cx="512" cy="512" r="380" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-dasharray="60 40"/>
            <circle cx="512" cy="512" r="270" fill="#FFFFFF"/>
            <text x="512" y="512" font-family="Arial, sans-serif" font-size="320" font-weight="bold" fill="#000000" text-anchor="middle" dominant-baseline="central">¥</text>
        </svg>

        <h1>黑白记账</h1>
        <p class="tagline">极简风格的个人记账应用 · 本地存储 · 云端同步</p>

        <div class="features">
            <div class="feature-card">
                <div class="feature-icon">💰</div>
                <div class="feature-title">收入管理</div>
                <div class="feature-desc">按来源和地区记录收入，自动统计月度合计</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">📋</div>
                <div class="feature-title">借入借出</div>
                <div class="feature-desc">管理应收应付，支持部分结清和逾期提醒</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">📊</div>
                <div class="feature-title">数据分析</div>
                <div class="feature-desc">周/月/年统计，来源与地区对比一目了然</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🎯</div>
                <div class="feature-title">储蓄目标</div>
                <div class="feature-desc">设定储蓄目标，追踪完成进度</div>
            </div>
        </div>

        <div>
            <a href="#" class="btn">下载 iOS 版</a>
            <a href="#" class="btn btn-outline">下载 Android 版</a>
        </div>

        <footer>
            © 2025 黑白记账 · 数据仅存储在本地设备
        </footer>
    </div>
</body>
</html>
